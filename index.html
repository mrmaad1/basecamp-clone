<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basecamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f4f0; color: #222222; }
        .bc-btn { background-color: #28a745; transition: background 0.1s ease; }
        .bc-btn:hover { background-color: #218838; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- Basecamp Global Header -->
    <header class="bg-white border-b border-gray-300 px-6 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-6 h-6 bg-[#1a365d] rounded-sm flex items-center justify-center text-white font-bold text-xs">BC</div>
            <span class="text-lg font-bold tracking-tight text-gray-900">Basecamp</span>
        </div>
        <div id="user-status" class="text-xs text-gray-500 font-medium">
            Not signed in
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        
        <!-- Login Card -->
        <div id="auth-box" class="max-w-sm w-full bg-white border border-gray-300 rounded-none p-8 shadow-sm">
            <h1 class="text-xl font-bold text-gray-900 mb-1">Log in to your account</h1>
            <p class="text-xs text-gray-500 mb-6">Access your projects, chats, and to-dos.</p>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Email address</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 border border-gray-300 rounded-sm focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 border border-gray-300 rounded-sm focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <button type="submit" class="w-full bc-btn text-white font-semibold py-2 px-4 rounded-sm text-sm">
                    Log in
                </button>
            </form>
        </div>

        <!-- Project Dashboard -->
        <div id="dashboard-box" class="hidden max-w-3xl w-full bg-white border border-gray-300 p-8 shadow-sm">
            <div class="border-b border-gray-200 pb-4 mb-6 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-900">Your Projects</h2>
                <button class="bc-btn text-white text-xs font-semibold px-3 py-1.5 rounded-sm">Make a new project</button>
            </div>
            <div class="text-center py-12 border-2 border-dashed border-gray-200 text-gray-500 text-sm">
                <p class="mb-2">You don't have any active projects yet.</p>
                <span class="text-xs text-blue-600 underline cursor-pointer">Create your first project to get started</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-400 border-t border-gray-200 bg-white">
        Basecamp &bull; The happier, calmer way to work in groups.
    </footer>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
